name: Windows startup regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare test dependency
        run: python -m pip install "Pillow>=10.2,<13"
      - name: Check startup and failure diagnostics
        run: python -m unittest discover -s tests -v
